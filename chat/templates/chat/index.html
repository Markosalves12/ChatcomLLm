<!-- chat/templates/chat/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Conversas</title>
    <style>
        :root {
            --verde: #00a884;
            --verde-escuro: #008069;
            --fundo: #eae6df;
            --painel: #ffffff;
            --cinza: #f0f2f5;
            --texto: #111b21;
            --texto-2: #667781;
            --borda: #e9edef;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--fundo);
            color: var(--texto);
            min-height: 100vh;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; right: 0; height: 127px;
            background: var(--verde-escuro); z-index: -1;
        }
        .app {
            max-width: 900px; margin: 19px auto; background: var(--painel);
            height: calc(100vh - 38px); display: flex; flex-direction: column;
            box-shadow: 0 6px 18px rgba(11,20,26,.15); border-radius: 4px; overflow: hidden;
        }
        header {
            background: var(--cinza); padding: 12px 16px; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--borda);
        }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%; background: #dfe5e7; color: #fff;
            display: grid; place-items: center; font-weight: 600; flex-shrink: 0;
        }
        header h1 { font-size: 16px; font-weight: 500; }
        .busca { padding: 8px 12px; border-bottom: 1px solid var(--borda); display: flex; gap: 8px; }
        .busca input {
            flex: 1; background: var(--cinza); border: 0; border-radius: 8px; padding: 9px 14px;
            font-size: 14px; outline: none;
        }
        .busca button {
            background: var(--verde); color: #fff; border: 0; border-radius: 8px; padding: 0 18px;
            font-size: 14px; cursor: pointer; font-weight: 500;
        }
        .busca button:hover { background: var(--verde-escuro); }
        .lista { flex: 1; overflow-y: auto; }
        .item {
            display: flex; align-items: center; gap: 14px; padding: 0 16px; cursor: pointer;
            text-decoration: none; color: inherit;
        }
        .item:hover { background: var(--cinza); }
        .item .info { flex: 1; padding: 14px 0; border-bottom: 1px solid var(--borda); min-width: 0; }
        .item .nome { font-size: 16px; display: flex; justify-content: space-between; }
        .item .nome small { font-size: 12px; color: var(--texto-2); }
        .item .previa { font-size: 14px; color: var(--texto-2); margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .vazio { text-align: center; color: var(--texto-2); padding: 60px 24px; font-size: 14px; line-height: 1.6; }
        @media (max-width: 900px) {
            .app { margin: 0; height: 100vh; border-radius: 0; }
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="avatar" style="background: var(--verde)">IA</div>
        <h1>Conversas</h1>
    </header>
    <div class="busca">
        <input id="room-name-input" type="text" placeholder="Nome da conversa (ex: trabalho, estudos)">
        <button id="btn-abrir">Abrir</button>
    </div>
    <div class="lista" id="lista"></div>
</div>

{{ salas|json_script:"salas-data" }}
<script>
    const cores = ["#00a884", "#53bdeb", "#ff8a65", "#a78bfa", "#f59e0b", "#ef4444", "#10b981"];
    const corDe = n => cores[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % cores.length];
    const limpar = n => n.trim().replace(/\s+/g, "_").replace(/[^\w]/g, "");

    function abrir(nome) {
        nome = limpar(nome);
        if (!nome) return;
        window.location.pathname = "/chat/" + nome + "/";
    }

    const input = document.querySelector("#room-name-input");
    input.focus();
    input.addEventListener("keyup", e => { if (e.key === "Enter") abrir(input.value); });
    document.querySelector("#btn-abrir").onclick = () => abrir(input.value);

    const salas = JSON.parse(document.getElementById("salas-data").textContent);
    const lista = document.querySelector("#lista");

    if (!salas.length) {
        lista.innerHTML = '<div class="vazio">Nenhuma conversa ainda.<br>Digite um nome acima para começar a falar com a IA.</div>';
    }
    salas.forEach(s => {
        const nome = s.nome;
        const hora = new Date(s.quando).toLocaleTimeString("pt-BR", {hour: "2-digit", minute: "2-digit"});
        const a = document.createElement("a");
        a.className = "item";
        a.href = "/chat/" + nome + "/";
        a.innerHTML = `
            <div class="avatar" style="background:${corDe(nome)}">${nome[0].toUpperCase()}</div>
            <div class="info">
                <div class="nome"><span></span><small>${hora}</small></div>
                <div class="previa"></div>
            </div>`;
        a.querySelector(".nome span").textContent = nome.replace(/_/g, " ");
        a.querySelector(".previa").textContent = s.ultima || "";
        lista.appendChild(a);
    });
</script>
</body>
</html>
